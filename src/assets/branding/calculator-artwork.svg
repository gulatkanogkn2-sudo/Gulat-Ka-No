<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="calcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#050810" stroke="#00D9FF" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="#00D9FF" opacity="0.1" filter="url(#calcGlow)"/>

  <!-- Calculator Icon Matrix -->
  <rect x="100" y="80" width="200" height="240" rx="16" fill="#0B132B" stroke="url(#calcGrad)" stroke-width="3" filter="url(#calcGlow)"/>
  <!-- Display Screen -->
  <rect x="120" y="105" width="160" height="50" rx="8" fill="#050810" stroke="#00D9FF" stroke-width="1.5"/>
  <text x="265" y="138" font-family="monospace" font-weight="900" font-size="22" fill="#00D9FF" text-anchor="end">100.0 mcg</text>

  <!-- Button Grid -->
  <g fill="#1E293B" stroke="#00D9FF" stroke-width="1" rx="6">
    <rect x="120" y="170" width="40" height="35" rx="6"/>
    <rect x="180" y="170" width="40" height="35" rx="6"/>
    <rect x="240" y="170" width="40" height="35" rx="6"/>

    <rect x="120" y="215" width="40" height="35" rx="6"/>
    <rect x="180" y="215" width="40" height="35" rx="6"/>
    <rect x="240" y="215" width="40" height="35" rx="6"/>

    <rect x="120" y="260" width="40" height="35" rx="6"/>
    <rect x="180" y="260" width="40" height="35" rx="6"/>
    <rect x="240" y="260" width="40" height="35" rx="6" fill="#00D9FF"/>
  </g>
</svg>
