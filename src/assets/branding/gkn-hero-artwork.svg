<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#050810" />
      <stop offset="100%" stop-color="#1A0B2E" />
    </linearGradient>
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="magentaGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2ED1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="vialLiquidCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="80%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="vialLiquidMagenta" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2ED1" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#heroBg)" rx="24"/>

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.15" stroke="#00D9FF" stroke-width="1">
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="800" height="800" fill="url(#heroGrid)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="300" r="220" fill="#00D9FF" opacity="0.12" filter="url(#neonBlur)"/>
  <circle cx="550" cy="500" r="240" fill="#FF2ED1" opacity="0.12" filter="url(#neonBlur)"/>
  <circle cx="400" cy="400" r="180" fill="#8B5CF6" opacity="0.10" filter="url(#neonBlur)"/>

  <!-- Molecular Crystal Matrix (Background Layer) -->
  <g opacity="0.4" stroke="#00D9FF" stroke-width="2" fill="none">
    <line x1="200" y1="200" x2="350" y2="150"/>
    <line x1="350" y1="150" x2="500" y2="220"/>
    <line x1="500" y1="220" x2="600" y2="160"/>
    <line x1="350" y1="150" x2="380" y2="300"/>
    <circle cx="200" cy="200" r="12" fill="#00D9FF" filter="url(#softGlow)"/>
    <circle cx="350" cy="150" r="16" fill="#FF2ED1" filter="url(#softGlow)"/>
    <circle cx="500" cy="220" r="14" fill="#8B5CF6" filter="url(#softGlow)"/>
    <circle cx="600" cy="160" r="10" fill="#00D9FF"/>
    <circle cx="380" cy="300" r="12" fill="#00E676"/>
  </g>

  <!-- Central Scientific Vials (Foreground Group) -->
  
  <!-- VIAL 1: Left Cyan Vial -->
  <g transform="translate(240, 260)">
    <!-- Vial Glass Body Shadow & Glow -->
    <rect x="0" y="0" width="90" height="260" rx="16" fill="#050810" stroke="#00D9FF" stroke-width="3" filter="url(#softGlow)"/>
    <!-- Liquid Content -->
    <rect x="6" y="90" width="78" height="162" rx="10" fill="url(#vialLiquidCyan)" opacity="0.85"/>
    <ellipse cx="45" cy="90" rx="39" ry="12" fill="#00E676" opacity="0.9"/>
    <!-- Cap & Crimp -->
    <rect x="-5" y="-20" width="100" height="20" rx="4" fill="#1E293B" stroke="#00D9FF" stroke-width="2"/>
    <rect x="10" y="-35" width="70" height="16" rx="3" fill="#00D9FF"/>
    <!-- Measurement Scale Marks -->
    <line x1="70" y1="60" x2="82" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="74" y1="80" x2="82" y2="80" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="70" y1="100" x2="82" y2="100" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <line x1="74" y1="120" x2="82" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="70" y1="140" x2="82" y2="140" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <!-- Glass Highlight Reflection -->
    <rect x="12" y="10" width="12" height="230" rx="6" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- VIAL 2: Center Premium Magenta/Purple Vial -->
  <g transform="translate(355, 200)">
    <!-- Vial Glass Body -->
    <rect x="0" y="0" width="110" height="320" rx="20" fill="#050810" stroke="#FF2ED1" stroke-width="4" filter="url(#neonBlur)"/>
    <!-- Liquid Content -->
    <rect x="8" y="110" width="94" height="200" rx="14" fill="url(#vialLiquidMagenta)" opacity="0.9"/>
    <ellipse cx="55" cy="110" rx="47" ry="16" fill="#8B5CF6" opacity="0.9"/>
    <!-- Cap & Aluminium Crimp -->
    <rect x="-6" y="-24" width="122" height="24" rx="6" fill="#0F172A" stroke="#FF2ED1" stroke-width="2"/>
    <rect x="12" y="-42" width="86" height="20" rx="4" fill="#FF2ED1"/>
    <!-- Label -->
    <rect x="15" y="40" width="80" height="60" rx="6" fill="#050810" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9"/>
    <text x="55" y="65" font-family="monospace" font-weight="900" font-size="12" fill="#FF2ED1" text-anchor="middle">GKN-RESEARCH</text>
    <text x="55" y="82" font-family="monospace" font-weight="700" font-size="10" fill="#00D9FF" text-anchor="middle">PURITY 99.8%</text>
    <!-- Glass Highlight Reflection -->
    <rect x="16" y="10" width="16" height="290" rx="8" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- VIAL 3: Right Cyan/Blue Vial -->
  <g transform="translate(490, 280)">
    <rect x="0" y="0" width="85" height="230" rx="16" fill="#050810" stroke="#3B82F6" stroke-width="3" filter="url(#softGlow)"/>
    <rect x="6" y="80" width="73" height="142" rx="10" fill="url(#vialLiquidCyan)" opacity="0.8"/>
    <ellipse cx="42.5" cy="80" rx="36.5" ry="10" fill="#00D9FF" opacity="0.8"/>
    <rect x="-5" y="-18" width="95" height="18" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect x="10" y="-32" width="65" height="15" rx="3" fill="#3B82F6"/>
    <rect x="10" y="10" width="10" height="200" rx="5" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Holographic HUD Overlay Elements -->
  <g transform="translate(100, 640)">
    <!-- HUD Box -->
    <rect x="0" y="0" width="600" height="100" rx="16" fill="#050810" fill-opacity="0.8" stroke="#00D9FF" stroke-width="1.5" filter="url(#softGlow)"/>
    <!-- Status Indicator Circles -->
    <circle cx="40" cy="50" r="16" fill="#00D9FF" opacity="0.2"/>
    <circle cx="40" cy="50" r="8" fill="#00D9FF" filter="url(#softGlow)"/>
    <text x="75" y="44" font-family="monospace" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="2">GKN ANALYTICAL STANDARDS</text>
    <text x="75" y="68" font-family="monospace" font-size="12" fill="#00D9FF" letter-spacing="1">SYNTHETIC PEPTIDE RESEARCH STANDARDS</text>

    <!-- Mini Pulse Graph -->
    <path d="M 460 50 L 480 50 L 490 25 L 500 70 L 510 40 L 520 50 L 570 50" fill="none" stroke="#FF2ED1" stroke-width="2" filter="url(#softGlow)"/>
  </g>
</svg>
