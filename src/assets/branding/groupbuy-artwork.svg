<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="gbCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="70%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="gbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#gbGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#00D9FF" stroke-width="0.5" opacity="0.15">
    <path d="M 0 50 H 600 M 0 100 H 600 M 0 150 H 600 M 0 200 H 600 M 0 250 H 600 M 0 300 H 600 M 0 350 H 600"/>
    <path d="M 50 0 V 400 M 100 0 V 400 M 150 0 V 400 M 200 0 V 400 M 250 0 V 400 M 300 0 V 400 M 350 0 V 400 M 400 0 V 400 M 450 0 V 400 M 500 0 V 400 M 550 0 V 400"/>
  </g>

  <!-- Cyan Glow Aura -->
  <circle cx="450" cy="200" r="180" fill="#00D9FF" opacity="0.18" filter="url(#gbGlow)"/>

  <!-- Batch Vials Row -->
  <!-- Vial 1 (Back Left) -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="60" height="180" rx="12" fill="#050810" stroke="#00D9FF" stroke-width="2" opacity="0.7"/>
    <rect x="4" y="60" width="52" height="114" rx="8" fill="url(#gbCyan)" opacity="0.6"/>
    <rect x="-4" y="-12" width="68" height="12" rx="3" fill="#1E293B"/>
  </g>

  <!-- Vial 2 (Back Right) -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="60" height="180" rx="12" fill="#050810" stroke="#00D9FF" stroke-width="2" opacity="0.7"/>
    <rect x="4" y="60" width="52" height="114" rx="8" fill="url(#gbCyan)" opacity="0.6"/>
    <rect x="-4" y="-12" width="68" height="12" rx="3" fill="#1E293B"/>
  </g>

  <!-- Main Hero Vial (Center Front) -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="80" height="230" rx="16" fill="#050810" stroke="#00D9FF" stroke-width="3.5" filter="url(#gbGlow)"/>
    <rect x="6" y="80" width="68" height="144" rx="10" fill="url(#gbCyan)" opacity="0.9"/>
    <ellipse cx="40" cy="80" rx="34" ry="10" fill="#00E676"/>
    <rect x="-6" y="-18" width="92" height="18" rx="4" fill="#0F172A" stroke="#00D9FF" stroke-width="2"/>
    <rect x="10" y="-32" width="60" height="15" rx="3" fill="#00D9FF"/>
    <!-- Glass Highlight -->
    <rect x="12" y="10" width="12" height="205" rx="6" fill="#FFFFFF" opacity="0.3"/>
    <!-- Tech Label -->
    <rect x="12" y="30" width="56" height="35" rx="4" fill="#050810" stroke="#00E676" stroke-width="1"/>
    <text x="40" y="46" font-family="monospace" font-weight="800" font-size="8" fill="#00D9FF" text-anchor="middle">GROUPBUY</text>
    <text x="40" y="58" font-family="monospace" font-weight="700" font-size="7" fill="#00E676" text-anchor="middle">BATCH #42</text>
  </g>

  <!-- HUD Batch Progress Overlay -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="260" height="70" rx="10" fill="#050810" fill-opacity="0.85" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="16" y="28" font-family="monospace" font-weight="800" font-size="12" fill="#00D9FF" letter-spacing="1">GROUPBUY BATCH STATUS</text>
    <rect x="16" y="40" width="228" height="10" rx="5" fill="#1E293B"/>
    <rect x="16" y="40" width="180" height="10" rx="5" fill="#00D9FF" filter="url(#gbGlow)"/>
    <text x="16" y="62" font-family="monospace" font-size="9" fill="#94A3B8">ALLOCATION QUOTA: 79% FUNDED</text>
  </g>
</svg>
