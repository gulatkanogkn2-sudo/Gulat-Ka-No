<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="coaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="#050810" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="#8B5CF6" opacity="0.1" filter="url(#coaGlow)"/>

  <!-- COA Document Graphic -->
  <rect x="110" y="70" width="180" height="260" rx="12" fill="#0B132B" stroke="url(#coaGrad)" stroke-width="3" filter="url(#coaGlow)"/>
  
  <!-- Certificate Lines -->
  <line x1="140" y1="110" x2="260" y2="110" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="140" x2="240" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="140" y1="165" x2="230" y2="165" stroke="#94A3B8" stroke-width="2"/>
  <line x1="140" y1="190" x2="250" y2="190" stroke="#94A3B8" stroke-width="2"/>

  <!-- Seal of Verification -->
  <circle cx="230" cy="265" r="28" fill="#050810" stroke="#00E676" stroke-width="2" filter="url(#coaGlow)"/>
  <path d="M 218 265 L 226 273 L 242 255" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
