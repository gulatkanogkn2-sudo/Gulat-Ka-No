<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="logoGradMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2ED1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Hexagon Base -->
  <polygon points="256,32 448,144 448,368 256,480 64,368 64,144" fill="#050810" stroke="#00D9FF" stroke-width="6" filter="url(#glowCyan)"/>
  <polygon points="256,48 432,152 432,360 256,464 80,360 80,152" fill="#0B132B" stroke="#FF2ED1" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Tech Grid Lines -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#00D9FF" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#00D9FF" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- Outer Neon Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#logoGradCyan)" stroke-width="3" stroke-dasharray="30 15 10 15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#logoGradMagenta)" stroke-width="2" stroke-dasharray="40 20"/>

  <!-- Central GKN Typography -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" text-anchor="middle" letter-spacing="8" filter="url(#glowCyan)">
    GKN
  </text>
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#logoGradCyan)" text-anchor="middle" letter-spacing="8">
    GKN
  </text>

  <!-- Tagline Badge -->
  <rect x="156" y="325" width="200" height="28" rx="6" fill="#050810" stroke="#FF2ED1" stroke-width="1.5"/>
  <text x="256" y="344" font-family="monospace" font-weight="700" font-size="13" fill="#FF2ED1" text-anchor="middle" letter-spacing="3" filter="url(#glowMagenta)">
    RESEARCH LABS
  </text>
</svg>
