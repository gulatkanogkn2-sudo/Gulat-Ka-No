<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="chartGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="400" fill="#050810"/>

  <!-- Cyber Grid -->
  <g stroke="#00D9FF" stroke-width="0.5" opacity="0.1">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800"/>
    <path d="M 100 0 V 400 M 200 0 V 400 M 300 0 V 400 M 400 0 V 400 M 500 0 V 400 M 600 0 V 400 M 700 0 V 400"/>
  </g>

  <!-- Area Graph Fill -->
  <path d="M 50 320 Q 150 280 250 220 T 450 180 T 650 100 L 750 80 L 750 350 L 50 350 Z" fill="url(#chartGrad)"/>

  <!-- Line Chart -->
  <path d="M 50 320 Q 150 280 250 220 T 450 180 T 650 100 L 750 80" fill="none" stroke="#00D9FF" stroke-width="3" filter="url(#chartGlow)"/>

  <!-- Data Points -->
  <circle cx="50" cy="320" r="5" fill="#00D9FF" filter="url(#chartGlow)"/>
  <circle cx="250" cy="220" r="5" fill="#00D9FF" filter="url(#chartGlow)"/>
  <circle cx="450" cy="180" r="5" fill="#FF2ED1" filter="url(#chartGlow)"/>
  <circle cx="650" cy="100" r="5" fill="#00E676" filter="url(#chartGlow)"/>
  <circle cx="750" cy="80" r="6" fill="#00D9FF" filter="url(#chartGlow)"/>
</svg>
