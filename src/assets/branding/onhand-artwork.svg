<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ohGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#1A0B2E" />
    </linearGradient>
    <linearGradient id="ohPurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="ohGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#ohGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#8B5CF6" stroke-width="0.5" opacity="0.15">
    <path d="M 0 50 H 600 M 0 100 H 600 M 0 150 H 600 M 0 200 H 600 M 0 250 H 600 M 0 300 H 600 M 0 350 H 600"/>
    <path d="M 50 0 V 400 M 100 0 V 400 M 150 0 V 400 M 200 0 V 400 M 250 0 V 400 M 300 0 V 400 M 350 0 V 400 M 400 0 V 400 M 450 0 V 400 M 500 0 V 400 M 550 0 V 400"/>
  </g>

  <!-- Purple Glow Aura -->
  <circle cx="450" cy="200" r="180" fill="#8B5CF6" opacity="0.2" filter="url(#ohGlow)"/>

  <!-- In-Stock Inventory Vials -->
  <g transform="translate(320, 110)">
    <rect x="0" y="0" width="60" height="180" rx="12" fill="#050810" stroke="#8B5CF6" stroke-width="2" opacity="0.7"/>
    <rect x="4" y="50" width="52" height="124" rx="8" fill="url(#ohPurple)" opacity="0.6"/>
    <rect x="-4" y="-12" width="68" height="12" rx="3" fill="#1E293B"/>
  </g>

  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="60" height="180" rx="12" fill="#050810" stroke="#8B5CF6" stroke-width="2" opacity="0.7"/>
    <rect x="4" y="50" width="52" height="124" rx="8" fill="url(#ohPurple)" opacity="0.6"/>
    <rect x="-4" y="-12" width="68" height="12" rx="3" fill="#1E293B"/>
  </g>

  <!-- Main Hero Vial (Center Front) -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="80" height="230" rx="16" fill="#050810" stroke="#8B5CF6" stroke-width="3.5" filter="url(#ohGlow)"/>
    <rect x="6" y="70" width="68" height="154" rx="10" fill="url(#ohPurple)" opacity="0.9"/>
    <ellipse cx="40" cy="70" rx="34" ry="10" fill="#C084FC"/>
    <rect x="-6" y="-18" width="92" height="18" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="10" y="-32" width="60" height="15" rx="3" fill="#8B5CF6"/>
    <!-- Glass Highlight -->
    <rect x="12" y="10" width="12" height="205" rx="6" fill="#FFFFFF" opacity="0.3"/>
    <!-- Tech Label -->
    <rect x="12" y="25" width="56" height="35" rx="4" fill="#050810" stroke="#8B5CF6" stroke-width="1"/>
    <text x="40" y="41" font-family="monospace" font-weight="800" font-size="8" fill="#C084FC" text-anchor="middle">ONHAND</text>
    <text x="40" y="53" font-family="monospace" font-weight="700" font-size="7" fill="#00E676" text-anchor="middle">IN STOCK</text>
  </g>

  <!-- HUD In-Stock Badge Overlay -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="260" height="70" rx="10" fill="#050810" fill-opacity="0.85" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="16" y="28" font-family="monospace" font-weight="800" font-size="12" fill="#8B5CF6" letter-spacing="1">IMMEDIATE DISPATCH</text>
    <text x="16" y="52" font-family="monospace" font-size="10" fill="#00E676">READY FOR DISPATCH • SAME DAY</text>
  </g>
</svg>
